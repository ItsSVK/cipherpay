[package]
name = "token-wrap-compliance"
version = "0.1.0"
description = "Fork of spl-token-wrap with a compliance-focused MintCustomizer (confidential transfer + designated auditor) wired in at the CreateMint dispatch point"
edition.workspace = true
rust-version.workspace = true

[features]
no-entrypoint = []

[lib]
name = "token_wrap_compliance"
crate-type = ["cdylib", "lib"]
path = "src/lib.rs"

[dependencies]
bytemuck = { version = "1.23.2", features = ["derive"] }
mpl-token-metadata = { version = "5.1.1", features = ["serde"] }
num-derive = "0.4.2"
num-traits = "0.2.19"
serde_json = "1.0.143"
solana-account-info = "2.3.0"
solana-cpi = "2.2.1"
solana-instruction = "2.3.0"
solana-msg = "2.2.1"
solana-program-entrypoint = "2.3.0"
solana-program-error = "2.2.2"
solana-program-pack = "2.2.1"
solana-pubkey = "2.4.0"
solana-rent = "2.2.1"
solana-system-interface = { version = "1.0.0", features = ["bincode"] }
solana-sysvar = "2.3.0"
solana-zk-sdk = "2.3.7"
spl-associated-token-account-client = "2.0.0"
spl-pod = "0.5.1"
spl-token = { version = "8.0.0", features = ["no-entrypoint"] }
spl-token-2022 = { version = "9.0.0", features = ["no-entrypoint"] }
spl-token-metadata-interface = "0.7.0"
spl-transfer-hook-interface = "0.10.0"
spl-type-length-value = "0.8.0"
thiserror = "2.0.16"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("frozen-abi", "no-entrypoint"))',
    'cfg(feature, values("custom-heap", "custom-panic"))',
]
