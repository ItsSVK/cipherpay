[package]
name = "vault"
version = "0.1.0"
description = "Created with Anchor"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = "1.2.0"
anchor-spl = "1.2.0"
confidential-token-helpers = { path = "../../libs/confidential_token_helpers" }
spl-token-2022 = { version = "11.0.0", features = ["no-entrypoint"] }
spl-token-2022-interface = "3.0.0"
solana-instructions-sysvar = "3.0.1"
solana-zk-sdk-pod = "0.1.1"

[dev-dependencies]
litesvm = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-address = "2.7.0"
solana-instruction = "3.0.0"
solana-zk-sdk = "4.0.0"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
] }
