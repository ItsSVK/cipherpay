skip_local_validator = true

[toolchain]

[features]
resolution = true
skip-lint = false

[programs.localnet]
vault = "ELChxVFAiE5jv1SV3v3gprWeWxmbgX7ATWingW5VcB48"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# litesvm's bundled BPF loader doesn't yet support the SBPFv3 ISA that
# `anchor build`/`cargo build-sbf` emit by default, so the litesvm test
# suite needs the program rebuilt for the older v1 architecture first.
test = "cargo build-sbf --arch v1 --manifest-path programs/vault/Cargo.toml && cargo test"

[hooks]
